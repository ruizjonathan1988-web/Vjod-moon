# Builds the personal APKs for a fork: one for the TV, one for the phone.
# Both install next to the Play Store version instead of replacing it.
name: APK perso

on:
  workflow_dispatch:
  push:
    branches: [perso]

permissions:
  contents: write

# A newer push replaces the run under way, so an older build can never
# publish over a newer one.
concurrency:
  group: perso-apk
  cancel-in-progress: true

jobs:
  phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One fixed key for every build, so a new APK installs over the last.
      - name: Signature perso
        run: |
          cp .github/perso-signing/perso.keystore android/app/release.keystore
          cp .github/perso-signing/keystore.properties android/keystore.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'

      - run: flutter pub get

      # Only errors stop the build: the upstream code has infos and warnings
      # of its own.
      - name: Analyse
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings lib test > analyze.txt 2>&1
          status=$?
          grep -E "^ *error " analyze.txt | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -5 analyze.txt
          exit $status

      - name: Tests des ajouts
        run: |
          set +e
          flutter test test/data/services/tonight_test.dart test/data/services/taste_quiz_test.dart test/data/services/taste_check_in_test.dart test/data/services/for_you_ranker_test.dart test/data/services/home_highlights_test.dart test/data/services/home_row_tidy_test.dart test/data/services/seerr_age_gate_test.dart test/data/services/upcoming_picks_test.dart test/data/services/home_row_cache_store_test.dart test/data/services/trakt_test.dart test/data/services/betaseries_test.dart test/data/services/chart_cards_test.dart test/data/services/seed_recommendations_test.dart test/data/services/film_awards_test.dart test/data/services/french_box_office_test.dart test/preference/top10_sections_test.dart test/data/services/my_requests_test.dart test/data/services/taste_profile_test.dart test/data/services/saga_test.dart test/ui/layout/screen_form_test.dart test/ui/widgets/bottom_nav/fold_nav_test.dart test/ui/widgets/bottom_nav/bottom_navbar_test.dart test/ui/screens/home/home_row_image_type_test.dart test/ui/kids_mode_test.dart test/ui/theme/focus_foreground_contrast_test.dart test/data/services/vjod/vjod_personalizer_test.dart test/data/services/vjod/tv_playlists_test.dart test/data/services/seerr/arr_links_test.dart test/data/services/vjod/french_channels_test.dart test/data/services/vjod/channel_search_test.dart test/data/services/vjod/recent_channels_test.dart test/data/services/vjod/channel_grouping_test.dart test/util/web_tv_remote_test.dart test/util/secondary_library_test.dart test/util/provider_stream_test.dart test/data/services/vjod/xtream_catalog_test.dart test/data/services/vjod/ma_tv_alerts_test.dart test/data/services/vjod/ma_tv_shift_test.dart test/data/services/vjod/catalog_invite_test.dart test/data/services/vjod/jellyfin_vjod_config_test.dart test/data/services/vjod/tv_sources_test.dart test/data/services/vjod/ma_tv_test.dart test/data/services/vjod/iptv_progress_test.dart test/data/services/vjod/ma_tv_recordings_test.dart test/data/services/vjod/media_delete_test.dart test/data/services/vjod/iptv_next_test.dart test/ui/widgets/vjod/vjod_intro_test.dart test/ui/loading_animation_settings_test.dart test/data/services/media_bar_cache_test.dart test/ui/screens/vjod/provider_player_test.dart test/ui/widgets/app_update_banner_test.dart > tests.txt 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -E "Error|Expected|Actual|FAILED|\.dart:[0-9]+" tests.txt | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          tail -5 tests.txt
          exit $status

      # "Moonfin Beta" on the phone.
      - name: APK telephone
        run: |
          set +e
          flutter build apk --release --flavor mobile-beta --dart-define=DISTRIBUTION_CHANNEL=apk --dart-define=VJOD_BUILD=$(TZ=Europe/Paris date +%Y-%m-%dT%H:%M) --dart-define=VJOD_COMMIT=${GITHUB_SHA::7} > build-phone.txt 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -E "Error|error:|\.dart:[0-9]+|FAILURE|What went wrong" -A2 build-phone.txt | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          tail -5 build-phone.txt
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: moonfin-fold
          path: build/app/outputs/flutter-apk/*-release.apk

      # Direct download link, no GitHub sign-in: the release keeps the latest build.
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/*-release.apk moonfin-fold.apk
          gh release create perso-latest --repo "$GITHUB_REPOSITORY" --title "Dernière version perso" --notes "APK de la dernière compilation de la branche perso." --prerelease || true
          gh release upload perso-latest moonfin-fold.apk --repo "$GITHUB_REPOSITORY" --clobber
          python3 tool/vjod_release_notes.py > notes.txt
          gh release edit perso-latest --repo "$GITHUB_REPOSITORY" --title "VJOD $(head -1 notes.txt)" --notes "$(tail -n +2 notes.txt)" || true

  tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One fixed key for every build, so a new APK installs over the last.
      - name: Signature perso
        run: |
          cp .github/perso-signing/perso.keystore android/app/release.keystore
          cp .github/perso-signing/keystore.properties android/keystore.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'

      - run: flutter pub get

      # "VJOD" on the TV: the real TV build under its own id.
      - name: APK TV
        env:
          MOONFIN_TEST_ID_SUFFIX: .perso
        run: |
          set +e
          flutter build apk --release --flavor androidTv --dart-define=MOONFIN_FORCE_TV=true --dart-define=DISTRIBUTION_CHANNEL=android_tv_apk --dart-define=VJOD_BUILD=$(TZ=Europe/Paris date +%Y-%m-%dT%H:%M) --dart-define=VJOD_COMMIT=${GITHUB_SHA::7} > build-tv.txt 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -E "Error|error:|\.dart:[0-9]+|FAILURE|What went wrong" -A2 build-tv.txt | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          tail -5 build-tv.txt
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: moonfin-tv
          path: build/app/outputs/flutter-apk/*-release.apk

      - run: cp build/app/outputs/flutter-apk/*-release.apk moonfin-tv.apk

      # The light APK for old Fire TV sticks: 32-bit only, two to three times
      # smaller. A failure here never holds back the full one.
      - name: APK TV allégé (vieilles Fire TV, 32 bits)
        continue-on-error: true
        env:
          MOONFIN_TEST_ID_SUFFIX: .perso
          VJOD_TV_ABIS: armeabi-v7a
        run: |
          set +e
          rm -f build/app/outputs/flutter-apk/*-release.apk
          flutter build apk --release --flavor androidTv --target-platform android-arm --dart-define=MOONFIN_FORCE_TV=true --dart-define=DISTRIBUTION_CHANNEL=android_tv_apk --dart-define=VJOD_BUILD=$(TZ=Europe/Paris date +%Y-%m-%dT%H:%M) --dart-define=VJOD_COMMIT=${GITHUB_SHA::7} > build-tv32.txt 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -E "Error|error:|FAILURE|What went wrong" -A2 build-tv32.txt | head -20 | while IFS= read -r line; do echo "::warning::$line"; done
            exit $status
          fi
          cp build/app/outputs/flutter-apk/*-release.apk moonfin-tv-arm32.apk
          ls -la moonfin-tv.apk moonfin-tv-arm32.apk

      # Direct download link, no GitHub sign-in: the release keeps the latest build.
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create perso-latest --repo "$GITHUB_REPOSITORY" --title "Dernière version perso" --notes "APK de la dernière compilation de la branche perso." --prerelease || true
          gh release upload perso-latest moonfin-tv.apk --repo "$GITHUB_REPOSITORY" --clobber
          if [ -f moonfin-tv-arm32.apk ]; then
            gh release upload perso-latest moonfin-tv-arm32.apk --repo "$GITHUB_REPOSITORY" --clobber
          fi
          # VJOD's number and what it brings, for the update window (vjod_changes.dart).
          python3 tool/vjod_release_notes.py > notes.txt
          gh release edit perso-latest --repo "$GITHUB_REPOSITORY" --title "VJOD $(head -1 notes.txt)" --notes "$(tail -n +2 notes.txt)" || true

  # VJOD for the Mac: a DMG signed ad hoc (no paid Apple account), on its own
  # release (mac-latest), whose notes name the commit: the Mac app offers the
  # update when it was built from another one. A failure here never touches
  # the APKs.
  mac:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'

      - name: Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: DMG Mac
        env:
          BUILD_APPSTORE_PKG: '0'
          BUILD_DMG_GITHUB: '1'
          FETCH_CORES: '0'
          APP_NAME: VJOD
          DMG_CHANNEL: macos_dmg
        run: |
          set +e
          export VJOD_DART_DEFINES="--dart-define=VJOD_BUILD=$(TZ=Europe/Paris date +%Y-%m-%dT%H:%M) --dart-define=VJOD_COMMIT=${GITHUB_SHA::7}"
          chmod +x build-macos.sh
          ./build-macos.sh > build-mac.txt 2>&1
          status=$?
          tail -40 build-mac.txt
          if [ $status -ne 0 ]; then
            grep -E "error:|Error|\.dart:[0-9]+|FAILED" build-mac.txt | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $status

      - name: Publier la release Mac
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(ls VJOD_macOS_v*.dmg | head -1)" vjod-mac.dmg
          python3 tool/vjod_release_notes.py > notes.txt
          gh release create mac-latest --repo "$GITHUB_REPOSITORY" --title "VJOD Mac" --notes "Dernière version de VJOD pour Mac." --prerelease || true
          gh release upload mac-latest vjod-mac.dmg --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit mac-latest --repo "$GITHUB_REPOSITORY" --title "VJOD $(head -1 notes.txt) (Mac)" --notes "commit ${GITHUB_SHA::7}
          $(tail -n +2 notes.txt)" || true

  # VJOD for the iPad: an unsigned .ipa on its own release (ipad-latest), with
  # altstore.json, the AltStore source that offers each build as an update.
  # AltStore signs it with the user's free Apple account. A failure here never
  # touches the APKs or the Mac.
  ipad:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'

      - name: Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Fichier iPad
        run: |
          set +e
          export VERSION=$(python3 tool/vjod_release_notes.py | head -1) BUILD_NUM=$GITHUB_RUN_NUMBER
          ./tool/build_ipad.sh > build-ipad.txt 2>&1
          status=$?
          tail -40 build-ipad.txt
          if [ $status -ne 0 ]; then
            grep -E "error:|Error|\.dart:[0-9]+|FAILED" build-ipad.txt | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $status

      - name: Publier la release iPad
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tool/vjod_altstore_source.py vjod-ipad.ipa vjod-ipad-Info.plist ipad-latest > altstore.json
          python3 tool/vjod_release_notes.py > notes.txt
          gh release create ipad-latest --repo "$GITHUB_REPOSITORY" --title "VJOD iPad" --notes "VJOD pour iPad, à installer avec AltStore." --prerelease || true
          gh release upload ipad-latest vjod-ipad.ipa altstore.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit ipad-latest --repo "$GITHUB_REPOSITORY" --title "VJOD $(head -1 notes.txt) (iPad)" --notes "Source AltStore : https://github.com/${GITHUB_REPOSITORY}/releases/download/ipad-latest/altstore.json
          $(tail -n +2 notes.txt)" || true
