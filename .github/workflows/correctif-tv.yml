name: Correctif lecteur TV

on:
  push:
    branches: [perso]
    paths: ['.github/workflows/correctif-tv.yml']

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ajoute pill dans _withTvFocusNode
        run: |
          f=lib/ui/screens/playback/video_player_screen.dart
          if grep -q "pill: button.pill," "$f"; then echo "Deja corrige"; exit 0; fi
          perl -0pi -e 's/(    onRightBoundary: onRightBoundary,\n)(    child: button\.child,\n  \);)/$1    pill: button.pill,\n$2/' "$f"
          grep -n "pill: button.pill," "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Lecteur TV : les pastilles aux extremites gardent leur largeur"
          git push

      - name: Relance l'APK et la version web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run perso-apk.yml --ref perso
          gh workflow run deploy-web-pages.yml --ref perso
