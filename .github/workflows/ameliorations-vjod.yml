      - uses: actions/setup-java@v4
        if: steps.patch.outputs.done != 'yes'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.patch.outputs.done != 'yes'
        with:
          flutter-version: '3.47.2'

      - name: Verifie que le code compile
        if: steps.patch.outputs.done != 'yes'
        run: |
          flutter pub get
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings lib test > analyze.txt 2>&1
          status=$?
          grep -E "^ *error " analyze.txt | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          tail -5 analyze.txt
          if [ $status -ne 0 ]; then exit $status; fi
          flutter build apk --debug --flavor mobile-beta --dart-define=DISTRIBUTION_CHANNEL=apk > build.txt 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -E "Error|error:|e: |\.dart:[0-9]+|\.kt:[0-9]+|FAILURE|What went wrong" -A2 build.txt | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          tail -5 build.txt
          exit $status

      - name: Enregistre et relance l'APK et le web
        if: steps.patch.outputs.done != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin HEAD:perso
          gh workflow run perso-apk.yml --ref perso
          gh workflow run deploy-web-pages.yml --ref perso
