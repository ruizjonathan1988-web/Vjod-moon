name: Essai Samsung

# VJOD for Samsung TVs (Tizen 6.0+, 2021 and later), step 1: does the app
# build, start and play a film from the server. Runs on the claude/samsung-*
# branches only; never publishes over the Android APKs.
on:
  push:
    branches: ['claude/samsung-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tpk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: SDK Tizen
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y libncurses5 python3.8 libpython3.8 gettext \
            libkf5itemmodels5 libkf5kiowidgets5 libkchart2 dbus-x11 gnome-keyring
          curl -sSL https://download.tizen.org/sdk/Installer/tizen-sdk_10.0/web-cli_Tizen_SDK_10.0_ubuntu-64.bin -o install.bin
          chmod a+x install.bin
          ./install.bin --accept-license $HOME/tizen-studio
          rm install.bin
          $HOME/tizen-studio/package-manager/package-manager-cli.bin install \
            NativeToolchain-Gcc-9.2 IOT-Headed-6.0-NativeAppDevelopment-CLI

      # A throwaway signature, enough to build. Installing on the TV needs a
      # Samsung certificate tied to the set (made on the PC, see the notes).
      - name: Certificat d'essai
        run: |
          export PATH=$PATH:$HOME/tizen-studio/tools/ide/bin
          dbus-run-session -- bash -c "
          echo tizen | gnome-keyring-daemon --unlock &&
          tizen certificate -a vjod -p vjodessai -f vjod &&
          tizen security-profiles add -n vjod -a $HOME/tizen-studio-data/keystore/author/vjod.p12 -p vjodessai
          "

      - name: flutter-tizen
        run: |
          git clone --depth 1 https://github.com/flutter-tizen/flutter-tizen.git $HOME/flutter-tizen
          echo "$HOME/flutter-tizen/bin" >> $GITHUB_PATH
          echo "$HOME/tizen-studio/tools/ide/bin" >> $GITHUB_PATH

      - run: flutter-tizen doctor -v

      - name: Préparer la version Samsung
        run: python3 tool/tizen_prepare.py

      - name: Dépendances
        run: |
          set +e
          flutter-tizen pub get > pub.txt 2>&1
          status=$?
          tail -40 pub.txt
          if [ $status -ne 0 ]; then
            grep -E "Because|depends on|version solving failed|Error" pub.txt | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $status

      - name: Construire le TPK
        run: |
          set +e
          dbus-run-session -- bash -c "
          echo tizen | gnome-keyring-daemon --unlock &&
          flutter-tizen build tpk --release --device-profile tv --security-profile vjod \
            --dart-define=MOONFIN_TIZEN=true --dart-define=MOONFIN_FORCE_TV=true \
            --dart-define=VJOD_BUILD=$(TZ=Europe/Paris date +%Y-%m-%dT%H:%M) --dart-define=VJOD_COMMIT=${GITHUB_SHA::7}
          " > build.txt 2>&1
          status=$?
          tail -60 build.txt
          if [ $status -ne 0 ]; then
            grep -E "Error|error:|\.dart:[0-9]+|FAILED|failed" build.txt | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $status

      - name: Publier l'essai
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tpk=$(ls build/tizen/tpk/*.tpk | head -1)
          cp "$tpk" vjod-samsung.tpk
          ls -la vjod-samsung.tpk
          gh release create samsung-essai --repo "$GITHUB_REPOSITORY" --title "VJOD Samsung (essai)" --notes "Essai de VJOD pour les TV Samsung (Tizen 6.0+). Expérimental." --prerelease || true
          gh release upload samsung-essai vjod-samsung.tpk --repo "$GITHUB_REPOSITORY" --clobber
