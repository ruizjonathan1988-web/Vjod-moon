# Quick check for work in progress: analysis and tests, no APK.
name: Verif perso

on:
  workflow_dispatch:
  push:
    branches: [perso-wip]

# Writes the VJOD captures to their own branch, see the last step.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le secret VJOD_SERVEUR (sans l'afficher)
        env:
          VJOD_SERVEUR: ${{ secrets.VJOD_SERVEUR }}
        run: |
          case "$VJOD_SERVEUR" in
            https://*/jellyfin) echo "VJOD_SERVEUR : présent, bien formé" ;;
            "") echo "::error::Secret VJOD_SERVEUR absent"; exit 1 ;;
            *) echo "::error::VJOD_SERVEUR doit être seulement l'adresse, de la forme https://…/jellyfin, sans espace"; exit 1 ;;
          esac

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'

      - run: flutter pub get

      - name: Analyse
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings lib test > analyze.txt 2>&1
          status=$?
          grep -E "^ *(error|warning) " analyze.txt | grep -v "^ *warning .*\(deprecated\|unused_import\)" | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -5 analyze.txt
          exit $status

      # The analysis above leaves out unused imports, too many in the
      # upstream code to read. In what this fork added, every one is shown.
      - name: Code mort dans les ajouts
        if: always()
        run: |
          grep -E "unused_import|unused_element|unused_field|unused_local_variable|dead_code|unnecessary_non_null_assertion" analyze.txt \
            | grep -E "lib/(data/services/(trakt|betaseries|wikidata|chart_cards|french_box_office|home_highlights|home_row_tidy|home_row_cache_store|seerr/(seed_recommendations|taste_extras|for_you_ranker|for_you_service|abandoned|seerr_age_gate|upcoming_picks))|preference/(trakt_preferences|home_section_config)|ui/screens/settings/trakt_account_tile|ui/screens/home/home_view_model|di/modules/app_module)" \
            | while IFS= read -r line; do echo "::warning::$line"; done
          true

      - name: Tests
        if: always()
        run: |
          set +e
          flutter test test/data/services/tonight_test.dart test/data/services/taste_quiz_test.dart test/data/services/taste_check_in_test.dart test/data/services/for_you_ranker_test.dart test/data/services/home_highlights_test.dart test/data/services/home_row_tidy_test.dart test/data/services/seerr_age_gate_test.dart test/data/services/upcoming_picks_test.dart test/data/services/home_row_cache_store_test.dart test/data/services/trakt_test.dart test/data/services/betaseries_test.dart test/data/services/chart_cards_test.dart test/data/services/seed_recommendations_test.dart test/data/services/film_awards_test.dart test/data/services/french_box_office_test.dart test/preference/top10_sections_test.dart test/data/services/my_requests_test.dart test/data/services/taste_profile_test.dart test/data/services/saga_test.dart test/ui/layout/screen_form_test.dart test/ui/widgets/bottom_nav/fold_nav_test.dart test/ui/widgets/bottom_nav/bottom_navbar_test.dart test/ui/screens/home/home_row_image_type_test.dart test/ui/kids_mode_test.dart test/ui/theme/focus_foreground_contrast_test.dart test/data/services/vjod/vjod_personalizer_test.dart test/data/services/vjod/tv_playlists_test.dart test/data/services/seerr/arr_links_test.dart test/data/services/vjod/french_channels_test.dart test/data/services/vjod/channel_search_test.dart test/data/services/vjod/recent_channels_test.dart test/data/services/vjod/channel_grouping_test.dart test/util/web_tv_remote_test.dart test/util/secondary_library_test.dart test/util/provider_stream_test.dart test/data/services/vjod/xtream_catalog_test.dart test/data/services/vjod/ma_tv_alerts_test.dart test/data/services/vjod/ma_tv_shift_test.dart test/data/services/vjod/catalog_invite_test.dart test/data/services/vjod/jellyfin_vjod_config_test.dart test/data/services/vjod/tv_sources_test.dart test/data/services/vjod/ma_tv_test.dart test/data/services/vjod/iptv_progress_test.dart test/data/services/vjod/ma_tv_recordings_test.dart test/data/services/vjod/media_delete_test.dart test/data/services/vjod/iptv_next_test.dart test/data/services/vjod/web_iptv_test.dart test/data/services/vjod/iptv_cast_test.dart test/data/services/vjod/catalogue_availability_test.dart test/data/services/vjod/simple_mode_test.dart test/util/device_performance_test.dart test/util/vjod_log_test.dart test/util/vjod_changes_test.dart test/data/services/tv_apk_choice_test.dart test/ui/screens/home/home_row_empty_test.dart test/ui/screens/detail/vjod_front_row_test.dart test/ui/widgets/vjod/vjod_intro_test.dart test/ui/loading_animation_settings_test.dart test/data/services/media_bar_cache_test.dart test/ui/screens/vjod/provider_player_test.dart test/ui/widgets/app_update_banner_test.dart test/ui/widgets/seerr/seerr_for_you_sheet_test.dart test/util/vjod_home_server_test.dart test/ui/setup_wizard_gate_test.dart test/data/services/vjod/search_dedupe_test.dart test/data/services/vjod/web_relay_test.dart test/data/services/vjod/ma_tv_sports_test.dart test/data/services/vjod/ma_tv_multiview_test.dart test/ui/screens/vjod_tv/ma_tv_start_test.dart test/data/services/vjod/ma_tv_reports_test.dart test/ui/widgets/vjod/report_problem_test.dart test/data/services/vjod/ma_tv_enroll_test.dart test/data/services/app_update_trial_test.dart test/ui/screens/vjod_tv/ma_tv_guide_touch_test.dart test/data/services/vjod/search_channels_test.dart test/data/services/vjod/background_playback_test.dart test/data/services/vjod/ma_tv_replay_test.dart test/viewmodels/search_vjod_instant_test.dart test/viewmodels/search_view_model_people_test.dart test/data/services/vjod/vjod_snapshots_test.dart test/util/vjod_timings_test.dart test/ui/screens/home/continue_merge_test.dart test/data/services/vjod/replay_keep_test.dart test/data/services/vjod/watch_month_test.dart test/data/services/vjod/replay_alerts_test.dart test/data/services/deep_link_service_test.dart test/data/services/vjod/aura_test.dart test/playback/media3_fallback_test.dart test/data/services/seerr_pause_test.dart test/util/image_errors_test.dart test/util/vjod_smoothness_test.dart test/ui/screens/home/home_resume_refresh_test.dart test/data/viewmodels/season_fields_test.dart test/ui/widgets/seerr/seerr_season_choice_test.dart test/ui/widgets/vjod_quick_connect_test.dart test/data/services/seerr/seerr_page_cache_test.dart test/data/services/vjod/item_prefetch_test.dart test/data/repositories/seerr_freshen_test.dart test/data/services/live_downloads_test.dart test/data/services/live_tv_channels_light_test.dart test/util/vjod_light_test.dart test/data/services/replay_bonne_emission_test.dart test/playback/audio_capability_probe_test.dart test/data/services/vjod/vjod_collection_suite_test.dart test/ui/widgets/vjod_logo_turn_test.dart --reporter expanded > tests.txt 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -E -A4 "\[E\]|Expected:|Actual:|Which:|EXCEPTION|was thrown|Error: |test/.*\.dart [0-9]+:[0-9]+" tests.txt | grep -v "package:flutter_test\|dart:async\|^--$\|^ *$" | head -24 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          tail -5 tests.txt
          exit $status

      # Draws VJOD's screens to pictures and keeps them on the captures
      # branch, to be compared with the mock-up. Never fails the check.
      - name: Captures VJOD
        if: always()
        run: |
          flutter test test/vjod/vjod_preview_test.dart --update-goldens > captures.txt 2>&1 || true
          tail -15 captures.txt
          # A failure here never fails the check, so it is at least shown.
          grep -E -A3 "\[E\]|EXCEPTION CAUGHT|was thrown|overflowed by" captures.txt | grep -v "^--$\|^ *$" | head -30 | while IFS= read -r line; do
            echo "::warning::Captures : $line"
          done
          if ls test/vjod/captures/*.png > /dev/null 2>&1; then
            mkdir -p /tmp/cap && cp test/vjod/captures/*.png /tmp/cap/
            git config user.name "vjod-captures"
            git config user.email "vjod-captures@users.noreply.github.com"
            git checkout -q --orphan captures-tmp
            git rm -rfq .
            git clean -fdxq
            cp /tmp/cap/*.png .
            echo "${GITHUB_SHA}" > SOURCE
            git add -A
            git commit -qm "Captures ${GITHUB_SHA::7}"
            git push -qf origin HEAD:captures
          fi
